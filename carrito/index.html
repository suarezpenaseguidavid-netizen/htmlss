<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>carrito</title>
    <link rel="stylesheet" href="css/carrito.css">
</head>
<body class="cuerpo">
    <header class="header">
       <input type="text" placeholder="PRODUCTO" id="nombre">
       <input type="number" placeholder="CANTIDAD" id="cantidad">
       <input type="number" placeholder="PRECIO" id="precio">
       <button onclick="agregar()" id="agregar">Agregar al carrito</button>
    </header>
    <div class="title">
       <h2>Carrito</h2>
    </div>
    <div class="tabla">
       <table border="1" class="table">
           <thead>
               <tr>
                   <th>ID</th>
                   <th>Producto</th>
                   <th>Precio</th>
                   <th>Cantidad</th>
                   <th>Eliminar</th>
               </tr>
           </thead>
           <tbody id="tablaProductos"></tbody>
       </table>
    </div>
    <div>
       <h2 class="total">Total: $<span id="total">0</span></h2>
       <div class="mensaje">
          <p id="alerta"></p>
       </div>
    </div>
    <script src="js/carrito.js"></script>
</body>
</html>
