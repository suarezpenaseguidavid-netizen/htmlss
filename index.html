<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Evita barras de desplazamiento */
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 1. El elemento Canvas donde se renderizará el 3D -->
    <canvas id="webglCanvas"></canvas>

    <!-- 2. Importamos Three.js mediante ES Modules -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- AQUÍ IRÁ NUESTRO CÓDIGO DE THREE.JS ---
        
        // 1. Crear la Escena (el "mundo" virtual)
        const scene = new THREE.Scene();

        // 2. Crear la Cámara (el punto de vista del usuario)
        const camera = new THREE.PerspectiveCamera(
            75, // FOV (Campo de visión)
            window.innerWidth / window.innerHeight, // Relación de aspecto
            0.1, // Plano cercano
            1000 // Plano lejano
        );
        camera.position.z = 5; // Alejamos un poco la cámara

        // 3. Crear el Renderizador (el que usa WebGL para pintar en el canvas)
        const canvas = document.querySelector('#webglCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 4. Crear un Objeto (un cubo)
        const geometry = new THREE.BoxGeometry(1, 1, 1); // Ancho, alto, profundidad
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 }); // Color verde básico
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube); // Añadimos el cubo a la escena

        // 5. Función de animación (Loop para que se mueva y se renderice constantemente)
        function animate() {
            requestAnimationFrame(animate);

            // Rotamos el cubo un poco en cada fotograma
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;

            // Renderizamos la escena desde la perspectiva de la cámara
            renderer.render(scene, camera);
        }

        animate(); // Iniciamos la animación

        // 6. Hacer que sea responsivo si cambian el tamaño de la ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
