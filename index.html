<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gestion</title>
</head>
<body>
    <script>
    // Arreglo global para almacenar los objetos de los empleados
    let empleados = [];
    // Variable para almacenar la opción seleccionada por el usuario en el menú
    let opcion;

    // Bucle "do-while" para asegurar que el menú se muestre al menos una vez
    // y continúe repitiéndose hasta que el usuario elija la opción "5" (Salir)
    do {
        // Muestra el menú interactivo en una ventana emergente y captura la respuesta
        opcion = prompt(
            "===== SISTEMA DE EMPLEADOS =====\n\n" +
            "1. Registrar empleado\n" +
            "2. Listar empleados\n" +
            "3. Buscar empleado por identificación\n" +
            "4. Mostrar total de empleados\n" +
            "5. Salir\n\n" +
            "Seleccione una opción:"
        );

        // Evalúa la opción ingresada por el usuario y ejecuta la función correspondiente
        switch (opcion) {

            case "1":
                registrarEmpleado();
                break;

            case "2":
                listarEmpleados();
                break;

            case "3":
                buscarEmpleado();
                break;

            case "4":
                mostrarTotal();
                break;

            case "5":
                alert("Saliendo del sistema...");
                break;

            // Si el usuario ingresa algo diferente a los números del 1 al 5
            default:
                alert("Opción no válida.");
        }

    } while (opcion !== "5"); // Condición de parada: el ciclo termina si opcion es "5"


    /**
     * FUNCIÓN 1: Registrar un nuevo empleado
     * Pide los datos al usuario, valida que no se repita la identificación,
     * crea un objeto y lo guarda en el arreglo global.
     */
    function registrarEmpleado() {

        // 1. Solicita la identificación única del empleado
        const identificacion = prompt("Ingrese la identificación:");

        // 2. Validación de duplicados: Busca si ya existe un empleado con esa misma identificación
        const existe = empleados.find(
            empleado => empleado.identificacion === identificacion
        );

        // Si el método .find() encuentra algo (no es undefined), detiene la función
        if (existe) {
            alert("Ya existe un empleado con esa identificación.");
            return; // El "return" vacío corta la ejecución de la función inmediatamente
        }

        // 3. Captura el resto de los datos si la identificación es nueva
        const nombre = prompt("Ingrese el nombre:");
        const cargo = prompt("Ingrese el cargo:");
        // Se usa Number() para convertir el texto del prompt en un tipo de dato numérico
        const salario = Number(prompt("Ingrese el salario:"));
        const area = prompt("Ingrese el área de trabajo:");

        // 4. Estructura los datos capturados en un objeto de JavaScript
        const empleado = {
            identificacion, // Equivale a escribir identificacion: identificacion
            nombre,
            cargo,
            salario,
            area
        };

        // 5. Agrega el nuevo objeto 'empleado' al final del arreglo 'empleados'
        empleados.push(empleado);

        alert("Empleado registrado correctamente.");
    }


    /**
     * FUNCIÓN 2: Listar todos los empleados
     * Muestra en la consola del navegador la información de cada empleado registrado.
     */
    function listarEmpleados() {

        // Validación inicial: Si el arreglo está vacío, no tiene sentido recorrerlo
        if (empleados.length === 0) {
            alert("No hay empleados registrados.");
            return; // Detiene la función
        }

        // Limpia la consola para que la nueva lista no se mezcle con datos viejos
        console.clear();
        console.log("===== LISTA DE EMPLEADOS =====");

        // Recorre el arreglo de empleados usando un bucle forEach
        // 'empleado' representa el objeto actual y 'index' la posición en el arreglo (empieza en 0)
        empleados.forEach((empleado, index) => {

            // Imprime los datos formateados en la consola usando Template Literals (``)
            console.log(`\nEmpleado ${index + 1}`); // Suma 1 para que visualmente empiece en "Empleado 1"
            console.log(`Identificación: ${empleado.identificacion}`);
            console.log(`Nombre: ${empleado.nombre}`);
            console.log(`Cargo: ${empleado.cargo}`);
            console.log(`Salario: $${empleado.salario}`);
            console.log(`Área: ${empleado.area}`);
        });

        // Avisa al usuario dónde puede ver la información, ya que los prompts/alerts bloquean la pantalla
        alert("La lista de empleados se mostró en la consola.");
    }


    /**
     * FUNCIÓN 3: Buscar un empleado en específico
     * Filtra el arreglo por el número de identificación e imprime solo sus datos.
     */
    function buscarEmpleado() {

        // Solicita el número de identificación que se desea buscar
        const identificacion = prompt(
            "Ingrese la identificación del empleado:"
        );

        // Usa .find() para buscar el primer objeto cuya propiedad 'identificacion' coincida con lo ingresado
        const empleado = empleados.find(
            empleado => empleado.identificacion === identificacion
        );

        // Si .find() no encontró ninguna coincidencia, devuelve 'undefined'.
        // El signo '!' invierte el valor (si es undefined, se vuelve true) y entra al if.
        if (!empleado) {
            alert("Empleado no encontrado.");
            return; // Detiene la función
        }

        // Si lo encuentra, limpia la consola y muestra únicamente los datos de ese empleado
        console.clear();
        console.log("===== EMPLEADO ENCONTRADO =====");
        console.log(`Identificación: ${empleado.identificacion}`);
        console.log(`Nombre: ${empleado.nombre}`);
        console.log(`Cargo: ${empleado.cargo}`);
        console.log(`Salario: $${empleado.salario}`);
        console.log(`Área: ${empleado.area}`);

        alert("La información del empleado se mostró en la consola.");
    }


    /**
     * FUNCIÓN 4: Mostrar total de empleados
     * Utiliza la propiedad '.length' incorporada en los arreglos de JavaScript
     * para conocer cuántos elementos (empleados) hay guardados actualmente.
     */
    function mostrarTotal() {
        alert(`Total de empleados registrados: ${empleados.length}`);
    }
    </script>
</body>
</html>
